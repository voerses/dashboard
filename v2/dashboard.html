<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Crypto Trading Dashboard v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17; color: #e0e0e0; min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f35, #0d1117);
            padding: 16px 24px; border-bottom: 1px solid #2a3045;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { font-size: 20px; color: #fff; font-weight: 700; }
        .header .subtitle { color: #8b95a5; font-size: 13px; }
        .controls {
            display: flex; gap: 12px; align-items: center;
        }
        select, button {
            background: #1a1f35; color: #e0e0e0; border: 1px solid #2a3045;
            padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        select:hover, button:hover { border-color: #4a90d9; }
        button.active { background: #2196F3; color: white; border-color: #2196F3; }

        .main { display: grid; grid-template-columns: 1fr 320px; gap: 0; min-height: calc(100vh - 60px); }

        .chart-area { padding: 16px; }
        .sidebar {
            background: #111827; border-left: 1px solid #2a3045; padding: 16px;
            overflow-y: auto;
        }

        .card {
            background: #1a1f35; border-radius: 8px; padding: 16px; margin-bottom: 12px;
            border: 1px solid #2a3045;
        }
        .card h3 { font-size: 14px; color: #8b95a5; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .regime-badge {
            display: inline-block; padding: 4px 12px; border-radius: 12px;
            font-size: 12px; font-weight: 600; margin: 2px;
        }
        .regime-TRENDING_UP { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .regime-TRENDING_DOWN { background: rgba(244, 67, 54, 0.2); color: #F44336; }
        .regime-MEAN_REVERTING { background: rgba(255, 193, 7, 0.2); color: #FFC107; }
        .regime-HIGH_VOL_CHAOS { background: rgba(156, 39, 176, 0.2); color: #CE93D8; }
        .regime-LOW_VOL_ACCUMULATION { background: rgba(33, 150, 243, 0.2); color: #64B5F6; }

        .signal-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #1a2035;
        }
        .signal-row:last-child { border-bottom: none; }
        .signal-name { font-size: 13px; }
        .signal-value { font-weight: 600; font-size: 14px; }
        .signal-buy { color: #4CAF50; }
        .signal-sell { color: #F44336; }
        .signal-flat { color: #888; }

        .big-signal {
            text-align: center; padding: 20px; font-size: 28px; font-weight: 700;
            border-radius: 8px; margin-bottom: 12px;
        }
        .big-buy { background: rgba(76, 175, 80, 0.15); color: #4CAF50; border: 2px solid #4CAF50; }
        .big-sell { background: rgba(244, 67, 54, 0.15); color: #F44336; border: 2px solid #F44336; }
        .big-flat { background: rgba(136, 136, 136, 0.1); color: #888; border: 2px solid #444; }

        .metric { display: flex; justify-content: space-between; padding: 6px 0; }
        .metric-label { color: #8b95a5; font-size: 12px; }
        .metric-value { font-weight: 600; font-size: 13px; }

        canvas { width: 100% !important; border-radius: 8px; background: #111827; }

        .timeline-slider {
            width: 100%; margin: 12px 0;
            -webkit-appearance: none; appearance: none;
            height: 6px; background: #2a3045; border-radius: 3px;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; background: #2196F3;
            border-radius: 50%; cursor: pointer;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        .trade-list { max-height: 300px; overflow-y: auto; }
        .trade-item {
            padding: 8px; margin-bottom: 4px; border-radius: 4px;
            font-size: 12px; background: #0d1117;
        }
        .trade-win { border-left: 3px solid #4CAF50; }
        .trade-loss { border-left: 3px solid #F44336; }

        @media (max-width: 1024px) {
            .main { grid-template-columns: 1fr; }
            .sidebar { border-left: none; border-top: 1px solid #2a3045; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Elite Crypto Trading Dashboard</h1>
            <div class="subtitle">HMM Regime Detection + Multi-Strategy Engine</div>
        </div>
        <div class="controls">
            <select id="assetSelect">
                <option value="BTC">BTC</option>
                <option value="ETH">ETH</option>
                <option value="SOL">SOL</option>
            </select>
            <select id="strategySelect">
                <option value="HMM Regime Adaptive">HMM Regime Adaptive</option>
                <option value="Momentum Trend">Momentum Trend</option>
                <option value="Mean Reversion Z">Mean Reversion Z</option>
                <option value="Funding+OI Divergence">Funding+OI Divergence</option>
                <option value="Multi-Factor Ensemble">Multi-Factor Ensemble</option>
            </select>
            <button id="btnLoad" onclick="loadSignals()">Load Data</button>
        </div>
    </div>

    <div class="main">
        <div class="chart-area">
            <div class="card" style="padding: 8px;">
                <canvas id="priceChart" height="350"></canvas>
            </div>
            <input type="range" class="timeline-slider" id="timeSlider" min="0" max="100" value="100">
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #666;">
                <span id="dateStart">-</span>
                <span id="dateCurrent">-</span>
                <span id="dateEnd">-</span>
            </div>

            <div class="card" style="margin-top: 12px; padding: 8px;">
                <canvas id="regimeChart" height="80"></canvas>
            </div>

            <div class="card" style="margin-top: 12px; padding: 8px;">
                <canvas id="signalChart" height="120"></canvas>
            </div>
        </div>

        <div class="sidebar">
            <div id="currentSignal" class="big-signal big-flat">
                FLAT
            </div>

            <div class="card">
                <h3>Current Regime</h3>
                <div id="currentRegime">
                    <span class="regime-badge regime-MEAN_REVERTING">LOADING...</span>
                </div>
                <div id="regimeStats" style="margin-top: 8px;"></div>
            </div>

            <div class="card">
                <h3>Strategy Signals</h3>
                <div id="strategySignals">
                    <div class="signal-row">
                        <span class="signal-name">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Performance</h3>
                <div id="perfMetrics">
                    <div class="metric"><span class="metric-label">Total Return</span><span class="metric-value">-</span></div>
                    <div class="metric"><span class="metric-label">Max Drawdown</span><span class="metric-value">-</span></div>
                    <div class="metric"><span class="metric-label">Win Rate</span><span class="metric-value">-</span></div>
                    <div class="metric"><span class="metric-label">Sharpe</span><span class="metric-value">-</span></div>
                </div>
            </div>

            <div class="card">
                <h3>Recent Signals</h3>
                <div id="recentSignals" class="trade-list"></div>
            </div>
        </div>
    </div>

    <script>
    // Global data store
    let DATA = null;
    let currentAsset = 'BTC';
    let currentStrategy = 'HMM Regime Adaptive';
    let currentIdx = 0;

    const REGIME_NAMES = {
        1: 'TRENDING_UP', 2: 'TRENDING_DOWN', 3: 'MEAN_REVERTING',
        4: 'HIGH_VOL_CHAOS', 5: 'LOW_VOL_ACCUMULATION'
    };
    const REGIME_COLORS = {
        1: '#4CAF50', 2: '#F44336', 3: '#FFC107', 4: '#CE93D8', 5: '#64B5F6'
    };
    const REGIME_LABELS = {
        1: 'Trending Up', 2: 'Trending Down', 3: 'Mean Reverting',
        4: 'High Vol Chaos', 5: 'Low Vol Accumulation'
    };

    async function loadSignals() {
        try {
            const resp = await fetch('outputs_v2/signals.json');
            DATA = await resp.json();
            currentAsset = document.getElementById('assetSelect').value;
            currentStrategy = document.getElementById('strategySelect').value;
            render();
        } catch (e) {
            alert('Failed to load signals.json. Make sure to run the backtest first (python run_v2.py).\n\nError: ' + e.message);
        }
    }

    function render() {
        if (!DATA) return;
        const asset = DATA[currentAsset];
        if (!asset) return;

        const slider = document.getElementById('timeSlider');
        slider.max = asset.dates.length - 1;
        currentIdx = parseInt(slider.value);
        if (currentIdx >= asset.dates.length) currentIdx = asset.dates.length - 1;

        updateDates(asset);
        updateCurrentSignal(asset);
        updateRegime(asset);
        updateStrategySignals(asset);
        updateRecentSignals(asset);
        drawPriceChart(asset);
        drawRegimeChart(asset);
        drawSignalChart(asset);
    }

    function updateDates(asset) {
        document.getElementById('dateStart').textContent = asset.dates[0].split(' ')[0];
        document.getElementById('dateCurrent').textContent = asset.dates[currentIdx].split(' ')[0];
        document.getElementById('dateEnd').textContent = asset.dates[asset.dates.length - 1].split(' ')[0];
    }

    function updateCurrentSignal(asset) {
        const strat = asset.strategies[currentStrategy];
        if (!strat) return;

        const signal = strat.signal[currentIdx];
        const el = document.getElementById('currentSignal');

        if (signal > 0) {
            el.className = 'big-signal big-buy';
            el.innerHTML = '&#9650; BUY<br><span style="font-size:14px">Size: ' +
                          (strat.position_size[currentIdx] * 100).toFixed(1) + '%</span>';
        } else if (signal < 0) {
            el.className = 'big-signal big-sell';
            el.innerHTML = '&#9660; SELL<br><span style="font-size:14px">Size: ' +
                          (strat.position_size[currentIdx] * 100).toFixed(1) + '%</span>';
        } else {
            el.className = 'big-signal big-flat';
            el.innerHTML = '&#8212; FLAT<br><span style="font-size:14px">No position</span>';
        }
    }

    function updateRegime(asset) {
        const regime = asset.regimes[currentIdx];
        const name = REGIME_NAMES[regime] || 'UNKNOWN';
        const label = REGIME_LABELS[regime] || 'Unknown';

        document.getElementById('currentRegime').innerHTML =
            `<span class="regime-badge regime-${name}">${label}</span>`;

        // Regime stats
        const counts = {};
        for (const r of asset.regimes) {
            const n = REGIME_LABELS[r] || 'Unknown';
            counts[n] = (counts[n] || 0) + 1;
        }
        let html = '';
        for (const [n, c] of Object.entries(counts)) {
            const pct = (c / asset.regimes.length * 100).toFixed(0);
            html += `<div class="metric"><span class="metric-label">${n}</span><span class="metric-value">${pct}%</span></div>`;
        }
        document.getElementById('regimeStats').innerHTML = html;
    }

    function updateStrategySignals(asset) {
        let html = '';
        for (const [name, strat] of Object.entries(asset.strategies)) {
            const sig = strat.signal[currentIdx];
            const size = strat.position_size[currentIdx];
            let cls, label;
            if (sig > 0) { cls = 'signal-buy'; label = `BUY ${(size*100).toFixed(0)}%`; }
            else if (sig < 0) { cls = 'signal-sell'; label = `SELL ${(size*100).toFixed(0)}%`; }
            else { cls = 'signal-flat'; label = 'FLAT'; }

            const isActive = name === currentStrategy ? ' style="font-weight:700"' : '';
            html += `<div class="signal-row"${isActive}>
                <span class="signal-name">${name}</span>
                <span class="signal-value ${cls}">${label}</span>
            </div>`;
        }
        document.getElementById('strategySignals').innerHTML = html;
    }

    function updateRecentSignals(asset) {
        const strat = asset.strategies[currentStrategy];
        if (!strat) return;

        let html = '';
        let changes = [];
        for (let i = 1; i <= currentIdx; i++) {
            if (strat.signal[i] !== strat.signal[i-1]) {
                changes.push({
                    idx: i,
                    date: asset.dates[i].split(' ')[0],
                    from: strat.signal[i-1],
                    to: strat.signal[i],
                    price: asset.close[i].toFixed(2),
                    size: (strat.position_size[i] * 100).toFixed(0)
                });
            }
        }

        // Show last 20 changes
        changes = changes.slice(-20).reverse();
        for (const ch of changes) {
            let action, cls;
            if (ch.to > 0) { action = `BUY (${ch.size}%)`; cls = 'trade-win'; }
            else if (ch.to < 0) { action = `SELL (${ch.size}%)`; cls = 'trade-loss'; }
            else { action = 'EXIT'; cls = ch.from > 0 ? 'trade-win' : 'trade-loss'; }

            html += `<div class="trade-item ${cls}">
                <strong>${action}</strong> @ $${ch.price}<br>
                <span style="color:#666">${ch.date}</span>
            </div>`;
        }

        if (!html) html = '<div style="color:#666;font-size:12px;padding:8px;">No signals yet</div>';
        document.getElementById('recentSignals').innerHTML = html;
    }

    function drawPriceChart(asset) {
        const canvas = document.getElementById('priceChart');
        const ctx = canvas.getContext('2d');
        const W = canvas.parentElement.offsetWidth - 16;
        const H = 350;
        canvas.width = W * 2; canvas.height = H * 2;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.scale(2, 2);

        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, W, H);

        const prices = asset.close;
        const strat = asset.strategies[currentStrategy];
        const end = currentIdx + 1;
        const start = Math.max(0, end - 365); // Show last year
        const visiblePrices = prices.slice(start, end);

        if (visiblePrices.length < 2) return;

        const minP = Math.min(...visiblePrices) * 0.98;
        const maxP = Math.max(...visiblePrices) * 1.02;
        const margin = { top: 20, right: 60, bottom: 30, left: 10 };
        const chartW = W - margin.left - margin.right;
        const chartH = H - margin.top - margin.bottom;

        const xScale = i => margin.left + (i / (visiblePrices.length - 1)) * chartW;
        const yScale = p => margin.top + (1 - (p - minP) / (maxP - minP)) * chartH;

        // Price line
        ctx.beginPath();
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < visiblePrices.length; i++) {
            const x = xScale(i);
            const y = yScale(visiblePrices[i]);
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Buy/Sell markers
        if (strat) {
            for (let i = 0; i < visiblePrices.length; i++) {
                const globalIdx = start + i;
                if (globalIdx > 0 && strat.signal[globalIdx] !== strat.signal[globalIdx - 1]) {
                    const x = xScale(i);
                    const y = yScale(visiblePrices[i]);

                    if (strat.signal[globalIdx] > 0) {
                        // Buy triangle up
                        ctx.fillStyle = '#4CAF50';
                        ctx.beginPath();
                        ctx.moveTo(x, y + 5);
                        ctx.lineTo(x - 6, y + 15);
                        ctx.lineTo(x + 6, y + 15);
                        ctx.fill();
                    } else if (strat.signal[globalIdx] < 0) {
                        // Sell triangle down
                        ctx.fillStyle = '#F44336';
                        ctx.beginPath();
                        ctx.moveTo(x, y - 5);
                        ctx.lineTo(x - 6, y - 15);
                        ctx.lineTo(x + 6, y - 15);
                        ctx.fill();
                    } else {
                        // Exit circle
                        ctx.fillStyle = '#FFC107';
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        // Color background by signal state
        if (strat) {
            ctx.globalAlpha = 0.05;
            for (let i = 0; i < visiblePrices.length; i++) {
                const globalIdx = start + i;
                const x1 = xScale(i);
                const x2 = i < visiblePrices.length - 1 ? xScale(i + 1) : x1 + 2;

                if (strat.signal[globalIdx] > 0) {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(x1, margin.top, x2 - x1, chartH);
                } else if (strat.signal[globalIdx] < 0) {
                    ctx.fillStyle = '#F44336';
                    ctx.fillRect(x1, margin.top, x2 - x1, chartH);
                }
            }
            ctx.globalAlpha = 1;
        }

        // Current price cursor
        const lastX = xScale(visiblePrices.length - 1);
        const lastY = yScale(visiblePrices[visiblePrices.length - 1]);
        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = '#4a90d9';
        ctx.moveTo(margin.left, lastY);
        ctx.lineTo(W - margin.right, lastY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Price label
        ctx.fillStyle = '#4a90d9';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('$' + visiblePrices[visiblePrices.length - 1].toFixed(2), W - margin.right + 4, lastY + 4);

        // Y-axis labels
        ctx.fillStyle = '#666';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
            const p = minP + (maxP - minP) * (i / 4);
            const y = yScale(p);
            ctx.fillText('$' + p.toFixed(0), W - 4, y + 3);
        }
    }

    function drawRegimeChart(asset) {
        const canvas = document.getElementById('regimeChart');
        const ctx = canvas.getContext('2d');
        const W = canvas.parentElement.offsetWidth - 16;
        const H = 80;
        canvas.width = W * 2; canvas.height = H * 2;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.scale(2, 2);

        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, W, H);

        const end = currentIdx + 1;
        const start = Math.max(0, end - 365);
        const visibleRegimes = asset.regimes.slice(start, end);

        const barW = W / visibleRegimes.length;
        for (let i = 0; i < visibleRegimes.length; i++) {
            ctx.fillStyle = REGIME_COLORS[visibleRegimes[i]] || '#444';
            ctx.globalAlpha = 0.7;
            ctx.fillRect(i * barW, 10, barW + 1, H - 20);
        }
        ctx.globalAlpha = 1;

        // Labels
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText('Market Regime', 4, 10);
    }

    function drawSignalChart(asset) {
        const canvas = document.getElementById('signalChart');
        const ctx = canvas.getContext('2d');
        const W = canvas.parentElement.offsetWidth - 16;
        const H = 120;
        canvas.width = W * 2; canvas.height = H * 2;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.scale(2, 2);

        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, W, H);

        const strat = asset.strategies[currentStrategy];
        if (!strat) return;

        const end = currentIdx + 1;
        const start = Math.max(0, end - 365);
        const signals = strat.signal.slice(start, end);
        const sizes = strat.position_size.slice(start, end);

        const barW = W / signals.length;
        const midY = H / 2;

        // Zero line
        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(0, midY);
        ctx.lineTo(W, midY);
        ctx.stroke();

        for (let i = 0; i < signals.length; i++) {
            const sig = signals[i];
            const size = sizes[i];

            if (sig > 0) {
                ctx.fillStyle = 'rgba(76, 175, 80, 0.7)';
                const h = size * (H / 2 - 5);
                ctx.fillRect(i * barW, midY - h, barW + 1, h);
            } else if (sig < 0) {
                ctx.fillStyle = 'rgba(244, 67, 54, 0.7)';
                const h = size * (H / 2 - 5);
                ctx.fillRect(i * barW, midY, barW + 1, h);
            }
        }

        // Labels
        ctx.fillStyle = '#4CAF50'; ctx.font = '10px sans-serif';
        ctx.fillText('LONG', 4, 14);
        ctx.fillStyle = '#F44336';
        ctx.fillText('SHORT', 4, H - 4);
        ctx.fillStyle = '#888';
        ctx.fillText(currentStrategy + ' Signal', W / 2 - 50, 14);
    }

    // Event listeners
    document.getElementById('timeSlider').addEventListener('input', function() {
        currentIdx = parseInt(this.value);
        render();
    });

    document.getElementById('assetSelect').addEventListener('change', function() {
        currentAsset = this.value;
        render();
    });

    document.getElementById('strategySelect').addEventListener('change', function() {
        currentStrategy = this.value;
        render();
    });

    // Auto-load on page open
    window.addEventListener('load', () => {
        loadSignals();
    });
    </script>
</body>
</html>
