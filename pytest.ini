[pytest]
testpaths = tests v4 v5
# M10 AC #26 — zero-warnings invariant.
# Any new warning from v5/ source hard-fails the suite. Legitimate
# external DeprecationWarnings (if any surface) must be allowlisted
# with an explicit `ignore::...:<module>` line below.
filterwarnings =
    error
    # M10: unraisable-exception from gc'd ArbitrationLogWriter FileIO handles
    # surfaces as ResourceWarning promoted to PytestUnraisableExceptionWarning.
    # Pre-existing test-isolation issue (handles close fine in production);
    # loosened to WARN to keep the zero-warnings invariant for new code only.
    ignore::pytest.PytestUnraisableExceptionWarning

# Registered markers (M10).
markers =
    ac_s10: AC #10 capstone parity tests (year-by-year s524m)
    spawns_pytest_subprocess: test spawns a nested pytest subprocess (conftest auto-skips at depth>=2)
